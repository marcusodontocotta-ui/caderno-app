databases:
  - name: caderno-db
    databaseName: caderno
    user: caderno_app
    plan: free

services:
  - type: web
    name: caderno-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caderno-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
